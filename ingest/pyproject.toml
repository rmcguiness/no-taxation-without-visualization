[project]
name = "ntwv-ingest"
version = "0.1.0"
description = "Data ingestion for No Taxation without Visualization: fetch raw government data, hash it, transform to tidy tables, load into Postgres."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "openpyxl>=3.1",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ntwv-ingest = "cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sources", "transforms", "load"]
py-modules = ["cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
