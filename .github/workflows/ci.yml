name: CI

# Validates every change before it can reach production.
# Runs on pull requests (the gate) and on pushes to main (post-merge safety net).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app (lint · types · tests · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier (format check)
        run: pnpm run format:check

      - name: ESLint
        run: pnpm run lint

      - name: TypeScript
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Production build
        run: pnpm run build
        env:
          # Pages are force-dynamic, so the build needs no live DB. A dummy
          # value keeps any accidental client construction from throwing.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  ingest:
    name: Data pipeline (python transforms)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install ingest package
        run: pip install -e '.[dev]'

      - name: Pytest
        # DB- and network-dependent tests self-skip when unavailable (see
        # test_load_idempotent.py / test_real_data.py); transform + validation
        # tests always run.
        run: pytest
