services:
  postgres:
    image: postgres:16-alpine
    container_name: ntwv-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ntwv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ntwv_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ntwv}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ntwv} -d ${POSTGRES_DB:-ntwv}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
